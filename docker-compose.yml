# Local demonstration. Only Nginx is published, on localhost:8080 by default.
name: iron-pulse-local

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gym_db}
      POSTGRES_USER: ${DB_USER:-gymuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gympassword}
      TZ: Europe/Madrid
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Iron Pulse}
      DEBUG: ${DEBUG:-True}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-key-cambiar-en-produccion-minimo-32}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-gym_db}
      DB_USER: ${DB_USER:-gymuser}
      DB_PASSWORD: ${DB_PASSWORD:-gympassword}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      TZ: Europe/Madrid
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_IP:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
