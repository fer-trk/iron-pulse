name: Backend tests

on:
  pull_request:
  push:
    branches: [developer, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.11 / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEBUG: "False"
      # A test that accidentally uses the real engine must fail, not reach a DB.
      DB_HOST: unreachable.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install application and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend suite
        run: python -m pytest -q --junitxml=.test-results/pytest.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: .test-results/pytest.xml
          if-no-files-found: warn
