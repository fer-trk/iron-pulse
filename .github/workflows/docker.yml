name: Docker deployment

on:
  pull_request:
  push:
    branches: [developer, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment:
    name: Compose / ${{ matrix.compose }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compose: [docker-compose.yml, docker-compose.prod.yml]
    env:
      COMPOSE_PROJECT_NAME: iron-pulse-check-ci
      COMPOSE_FILE: ${{ matrix.compose }}
      HTTP_PORT: "18080"
      DEBUG: "False"
      SECRET_KEY: ci-only-docker-signing-key-never-use-in-production-2026
      DB_PASSWORD: "ci-only-postgres-password@2026:%"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start isolated stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check frontend, API and database persistence
        run: python scripts/check_docker_deployment.py
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100
      - name: Remove temporary test stack and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
